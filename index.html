<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Bereke</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: #121212;
    --card: #1c1c1c;
    --accent: #e8452c;
    --accent-2: #6fbf3c;
    --text: #f4f4f4;
    --muted: #9a9a9a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:90px;
  }
  header{
    position:sticky; top:0; z-index:10; background:var(--bg);
    padding:14px 14px 10px; border-bottom:1px solid #262626;
  }
  .brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:20px; margin-bottom:2px;}
  .brand .logo{
    background:var(--accent); color:#fff; padding:4px 10px; border-radius:14px; font-size:16px;
  }
  .date-sub{font-size:13px; color:var(--muted); margin-top:2px;}

  .promo{
    margin:12px 14px 4px; padding:16px; border-radius:16px;
    background:linear-gradient(135deg,#f0603f,#c62f1a); text-align:center; font-weight:800; font-size:16px;
  }

  main{padding:6px 14px 14px;}
  h2.section{font-size:19px; margin:16px 2px 10px;}

  .list{display:flex; flex-direction:column; gap:14px;}
  .item{
    background:var(--card); border-radius:16px; overflow:hidden; display:flex;
  }
  .item img{width:120px; min-width:120px; height:120px; object-fit:cover; background:#333;}
  .item .info{padding:12px; display:flex; flex-direction:column; gap:6px; flex:1; min-width:0;}
  .item .name{font-size:15px; font-weight:700; line-height:1.25;}
  .item .desc{font-size:12px; color:var(--muted); line-height:1.35;}
  .row-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:4px;}
  .price{font-weight:800; font-size:16px;}
  .add-btn{
    background:var(--accent); color:#fff; border:none; width:34px; height:34px; border-radius:50%;
    font-size:19px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .stepper{display:flex; align-items:center; gap:10px; background:var(--accent); border-radius:20px; padding:5px 10px; flex-shrink:0;}
  .stepper button{background:none; border:none; color:#fff; font-size:17px; font-weight:800; width:20px; cursor:pointer;}
  .stepper span{color:#fff; font-weight:700; min-width:14px; text-align:center;}

  .empty-menu{padding:40px 16px; text-align:center; color:var(--muted); font-size:14px;}

  .cart-bar{
    position:fixed; left:14px; right:14px; bottom:14px; background:var(--accent);
    border-radius:18px; padding:14px 18px; display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 6px 20px rgba(0,0,0,.4); cursor:pointer; font-weight:800;
  }
  .hidden{display:none !important;}

  /* Cart drawer */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:20;}
  .drawer{
    position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--bg);
    border-radius:20px 20px 0 0; max-height:85vh; display:flex; flex-direction:column;
  }
  .drawer-head{display:flex; justify-content:space-between; align-items:center; padding:16px;}
  .drawer-head h3{margin:0; font-size:20px;}
  .drawer-head .close{font-size:22px; color:var(--muted); cursor:pointer;}
  .cart-list{overflow-y:auto; padding:0 16px; flex:1;}
  .cart-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #232323;}
  .cart-row img{width:52px; height:52px; border-radius:10px; object-fit:cover; background:#333;}
  .cart-row .meta{flex:1;}
  .cart-row .meta .n{font-weight:700; font-size:14px;}
  .cart-row .meta .p{font-size:12.5px; color:var(--muted);}
  .summary{padding:12px 16px 4px; border-top:1px solid #232323;}
  .summary .line{display:flex; justify-content:space-between; padding:5px 0; font-size:14px; color:var(--muted);}
  .summary .total{display:flex; justify-content:space-between; padding:10px 0 4px; font-size:19px; font-weight:800; color:var(--text);}
  .free-note{background:#1e2f18; color:var(--accent-2); padding:8px 12px; border-radius:10px; font-size:12.5px; margin:6px 0;}
  .checkout-btn{
    margin:12px 16px 18px; background:var(--accent); color:#fff; border:none; border-radius:16px;
    padding:16px; font-size:16px; font-weight:800; cursor:pointer;
  }
  .empty{padding:30px 16px; text-align:center; color:var(--muted);}
  .note{padding:6px 16px 0; font-size:12.5px; color:var(--muted); text-align:center;}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="logo">bereke</span> Bereke</div>
  <div class="date-sub" id="dateSub">Kunlik menyu</div>
</header>

<div class="promo">Onam tayyorlagandek mazali, issiq taomlar 😋</div>

<main id="main"></main>

<div class="cart-bar hidden" id="cartBar">
  <span id="cartCount">0 ta mahsulot</span>
  <span id="cartTotal">0 so'm</span>
</div>

<div id="drawerRoot"></div>

<script>
let DISHES = [];
let DELIVERY_FEE = 15000;
let FREE_DELIVERY_THRESHOLD = 200000;

const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.expand(); tg.ready(); }

let cart = {}; // id -> {name, price, qty, image}

function fmt(n){ return n.toLocaleString('ru-RU').replace(/,/g,' '); }

// Bot serverida ishlayotgan "jonli" menyu manzili. Railway'da domain
// yaratgach, shu yerga o'sha manzil + /menu.json ni yozing. Bo'sh qolsa,
// yoki ishlamasa, pastdagi zaxira (static) menu.json fayli ishlatiladi.
const LIVE_MENU_API = "https://worker-production-0234.up.railway.app/menu.json";

async function init(){
  let data = null;
  if(LIVE_MENU_API){
    try{
      const res = await fetch(LIVE_MENU_API, {cache: 'no-store'});
      if(res.ok) data = await res.json();
    }catch(e){ /* jonli manzil ishlamasa, pastga o'tamiz */ }
  }
  if(!data){
    const res = await fetch('menu.json', {cache: 'no-store'});
    data = await res.json();
  }
  DISHES = data.taomlar || [];
  DELIVERY_FEE = data.yetkazib_berish;
  FREE_DELIVERY_THRESHOLD = data.bepul_yetkazib_berish_dan;
  document.getElementById('dateSub').textContent = data.sana || 'Kunlik menyu';
  renderMenu();
  updateCartBar();
}
init();

function renderMenu(){
  const main = document.getElementById('main');
  if(DISHES.length === 0){
    main.innerHTML = `<div class="empty-menu">Bugun uchun menyu hali kiritilmagan. Iltimos, birozdan so'ng qayta tekshiring.</div>`;
    return;
  }
  main.innerHTML = `<h2 class="section">🍽 Bugungi taomlar</h2><div class="list" id="list"></div>`;
  const list = document.getElementById('list');
  DISHES.forEach(d=>{
    const qty = cart[d.id] ? cart[d.id].qty : 0;
    const card = document.createElement('div');
    card.className = 'item';
    card.innerHTML = `
      <img src="${d.rasm}" alt="">
      <div class="info">
        <div class="name">${d.nomi}</div>
        ${d.tavsif ? `<div class="desc">${d.tavsif}</div>` : ''}
        <div class="row-bottom">
          <span class="price">${fmt(d.narx)} so'm</span>
          <div id="ctrl-${d.id}"></div>
        </div>
      </div>`;
    list.appendChild(card);
    renderControl(d, qty);
  });
}

function renderControl(d, qty){
  const el = document.getElementById(`ctrl-${d.id}`);
  if(!el) return;
  if(qty > 0){
    el.innerHTML = `<div class="stepper">
        <button onclick="changeQty('${d.id}', -1)">−</button>
        <span>${qty}</span>
        <button onclick="changeQty('${d.id}', 1)">+</button>
      </div>`;
  } else {
    el.innerHTML = `<button class="add-btn" onclick="changeQty('${d.id}', 1)">+</button>`;
  }
}

function findDish(id){
  return DISHES.find(d => d.id === id);
}

function changeQty(id, delta){
  const dish = findDish(id);
  if(!dish) return;
  if(!cart[id]) cart[id] = {name:dish.nomi, price:dish.narx, qty:0, image:dish.rasm};
  cart[id].qty += delta;
  if(cart[id].qty <= 0) delete cart[id];
  renderMenu();
  updateCartBar();
}

function cartTotals(){
  let count=0, subtotal=0;
  Object.values(cart).forEach(c=>{ count+=c.qty; subtotal += c.price*c.qty; });
  const delivery = (subtotal>0 && subtotal < FREE_DELIVERY_THRESHOLD) ? DELIVERY_FEE : 0;
  return {count, subtotal, delivery, total: subtotal+delivery};
}

function updateCartBar(){
  const {count, total} = cartTotals();
  const bar = document.getElementById('cartBar');
  if(count===0){ bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  document.getElementById('cartCount').textContent = `${count} ta mahsulot`;
  document.getElementById('cartTotal').textContent = `${fmt(total)} so'm`;
}

document.getElementById('cartBar').onclick = openCart;

function openCart(){
  const {subtotal, delivery, total} = cartTotals();
  const root = document.getElementById('drawerRoot');
  const rows = Object.entries(cart).map(([id,c])=>`
    <div class="cart-row">
      <img src="${c.image}">
      <div class="meta">
        <div class="n">${c.name}</div>
        <div class="p">${fmt(c.price)} so'm</div>
      </div>
      <div class="stepper">
        <button onclick="changeQty('${id}', -1); openCart();">−</button>
        <span>${c.qty}</span>
        <button onclick="changeQty('${id}', 1); openCart();">+</button>
      </div>
    </div>`).join('');

  root.innerHTML = `
    <div class="overlay" onclick="closeCart()"></div>
    <div class="drawer">
      <div class="drawer-head"><h3>Savatcha</h3><span class="close" onclick="closeCart()">✕</span></div>
      <div class="cart-list">${rows || '<div class="empty">Savatcha bo\'sh</div>'}</div>
      ${rows ? `
      <div class="summary">
        <div class="line"><span>Mahsulotlar</span><span>${fmt(subtotal)} so'm</span></div>
        <div class="line"><span>Yetkazib berish</span><span>${delivery===0 ? 'BEPUL' : fmt(delivery)+" so'm"}</span></div>
        ${delivery>0 ? `<div class="free-note">🚚 ${fmt(FREE_DELIVERY_THRESHOLD)} so'm dan — yetkazib berish BEPUL</div>` : ''}
        <div class="total"><span>Jami</span><span>${fmt(total)} so'm</span></div>
      </div>
      <div class="note">Ism, telefon va manzilni keyingi qadamda botda yozasiz 👇</div>
      <button class="checkout-btn" onclick="submitOrder()">Buyurtma berish</button>
      ` : ''}
    </div>`;
}

function closeCart(){
  document.getElementById('drawerRoot').innerHTML = '';
}

function submitOrder(){
  const {subtotal, delivery, total} = cartTotals();
  const items = Object.values(cart).map(c=>({name:c.name, price:c.price, qty:c.qty}));
  const payload = { items, subtotal, delivery, total };

  if(tg){
    tg.sendData(JSON.stringify(payload));
    tg.close();
  } else {
    alert('Buyurtma: ' + JSON.stringify(payload, null, 2));
  }
}
</script>
</body>
</html>
